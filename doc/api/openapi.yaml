openapi: 3.0.3
info:
  title: CMS-TeamWork 前后端统一接口（草案）
  version: 0.1.0
  license:
    name: Proprietary (team internal draft)
  description: '依据 CMS-SRS.md v2.5 与 doc/context/architecture.md。与 doc/api/api-spec.md 一致；详细规则、错误码与追溯以 doc/api/api-spec.md 为准。


    认证：服务端会话 Cookie（JSESSIONID，HttpOnly）+ CSRF 请求头 X-XSRF-TOKEN（登录除外的所有写请求）。不使用 JWT。


    统一响应体 {code, message, data}；HTTP 状态码按 SRS（400/401/403/404/409）。角色闸、归属闸失败统一 404。'
servers:
- url: /
  description: 同源部署，Nginx 反向代理 /api/**
security:
- sessionCookie: []
tags:
- name: AUTH
  description: 认证与账号
- name: ARTICLE
  description: 文章管理
- name: SUBMIT
  description: 提交、撤回与改期
- name: REVIEW
  description: 审核与下架
- name: AUDIT
  description: 操作留痕
- name: TAX
  description: 分类与标签
- name: MEDIA
  description: 媒体资源
- name: PUBLIC
  description: 博客前台公开接口
paths:
  /api/auth/csrf:
    get:
      tags:
      - AUTH
      summary: 获取 CSRF 令牌【补充】
      description: '在响应体返回会话绑定的 CSRF 令牌（HttpSessionCsrfTokenRepository）；不下发可读的 CSRF Cookie。登录、登出后需重新获取。


        覆盖需求：§4.1.2、FR-AUTH-003'
      security: []
      operationId: getCsrfToken
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CsrfToken'
  /api/auth/register:
    post:
      tags:
      - AUTH
      summary: 注册内容编辑账号
      description: '只能创建 EDITOR；注册不建立会话。需要 CSRF（匿名令牌）。


        覆盖需求：FR-USER-001、§4.1.1'
      security: []
      operationId: register
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      tags:
      - AUTH
      summary: 登录
      description: '成功后更换会话标识并下发 JSESSIONID（HttpOnly; SameSite=Lax; Path=/），登录前的 CSRF 令牌随之失效。不需要 CSRF。连续 5 次失败锁定 15 分钟；失败与锁定响应一致（40101）。


        覆盖需求：FR-AUTH-001、FR-AUTH-003、§4.1.2'
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/auth/logout:
    post:
      tags:
      - AUTH
      summary: 登出
      description: '销毁当前会话。


        覆盖需求：FR-AUTH-002'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: logout
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: 恒为 null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
  /api/auth/me:
    get:
      tags:
      - AUTH
      summary: 当前用户
      description: '返回当前用户与角色，用于前端角色分流。


        覆盖需求：FR-AUTH-005'
      operationId: getMe
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/articles:
    get:
      tags:
      - ARTICLE
      summary: 文章列表（编辑：我的文章；管理员：全部）
      description: '编辑结果集强制附加 author_id=当前用户；total 基于过滤后结果。


        覆盖需求：FR-ARTICLE-003、FR-ARTICLE-006、BR-SEARCH-001~005、X-ISO-01~04'
      operationId: listArticles
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ArticleStatus'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/AuthorFilter'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - updated_at_desc
          - updated_at_asc
          - created_at_desc
          default: updated_at_desc
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        required:
                        - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ArticleListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - ARTICLE
      summary: 创建文章草稿
      description: '仅编辑；管理员调用 404。系统字段或未知字段 → 400 FIELD_NOT_WRITABLE。正文规则见 doc/api/api-spec.md §6.0。


        覆盖需求：FR-ARTICLE-001、FR-TAX-003、FR-MEDIA-004'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/articles/counts:
    get:
      tags:
      - ARTICLE
      summary: 按状态计数【补充】
      description: '与文章列表同一套归属过滤：编辑只统计本人，管理员统计全部；6 种状态都返回，无文章为 0。不返回 404。


        覆盖需求：FR-ARTICLE-003、FR-ARTICLE-006、BR-SEARCH-002、BR-SEARCH-003、X-ISO-03、X-ISO-04'
      operationId: countArticlesByStatus
      parameters:
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/AuthorFilter'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/articles/{id}:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    get:
      tags:
      - ARTICLE
      summary: 文章详情
      description: '编辑仅本人文章；管理员全部。管理员查看待审核文章时返回 current_submission_id。


        覆盖需求：FR-ARTICLE-004、FR-REVIEW-001、BR-CONTENT-001'
      operationId: getArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - ARTICLE
      summary: 编辑文章
      description: '仅归属编辑，状态为草稿/驳回/已下架；全量替换；同时完成分类、标签、媒体关联/移除/替换。


        覆盖需求：FR-ARTICLE-002、FR-TAX-003、FR-MEDIA-001、FR-MEDIA-004'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - ARTICLE
      summary: 删除草稿
      description: '仅归属编辑；仅状态为草稿且无任何留痕；物理删除并清理媒体。


        覆盖需求：FR-ARTICLE-005、BR-DEL-001~005'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: deleteArticle
      parameters:
      - name: confirm
        in: query
        required: true
        schema:
          type: boolean
          enum:
          - true
        description: 二次确认，必须为 true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: 恒为 null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/articles/{id}/submit:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - SUBMIT
      summary: 提交审核
      description: '草稿/驳回/已下架 → 待审核；生成提交审核留痕（其 ID 即提交轮次标识）。


        覆盖需求：FR-SUBMIT-001、BR-001'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: submitArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/articles/{id}/withdraw:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - SUBMIT
      summary: 撤回待发布文章
      description: '待发布 → 草稿；清空预定时间，审核结论作废。


        覆盖需求：FR-SUBMIT-002、BR-PUB-009'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: withdrawArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/articles/{id}/reschedule:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - SUBMIT
      summary: 修改待发布文章的预定时间
      description: '新时间须严格晚于服务端当前时间；原预定时间已到 → 409。


        覆盖需求：FR-SUBMIT-003、BR-PUB-008'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: rescheduleArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/reviews/queue:
    get:
      tags:
      - REVIEW
      summary: 审核队列
      description: '仅管理员；按 submitted_at 升序、id 升序，固定排序。


        覆盖需求：FR-REVIEW-001'
      operationId: listReviewQueue
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - $ref: '#/components/parameters/AuthorFilter'
      - $ref: '#/components/parameters/TitleFilter'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        required:
                        - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ReviewQueueItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/reviews/standard:
    get:
      tags:
      - REVIEW
      summary: 当前审核标准与驳回类别【补充】
      description: '仅管理员。


        覆盖需求：§6.1.1、BR-CONTENT-005'
      operationId: getReviewStandard
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ReviewStandard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/articles/{id}/approve:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - REVIEW
      summary: 审核通过（含立即发布）
      description: '仅管理员；待审核且轮次匹配。无/已到预定时间 → 已发布；未来预定时间 → 待发布。原子生效。不接受内容字段或发布参数。


        覆盖需求：FR-REVIEW-002、FR-PUBLISH-001、FR-PUBLISH-003'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: approveArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/articles/{id}/reject:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - REVIEW
      summary: 驳回
      description: '仅管理员；必须带轮次、驳回类别与意见。


        覆盖需求：FR-REVIEW-003、BR-004、BR-AUDIT-003'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: rejectArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/articles/{id}/unpublish:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - REVIEW
      summary: 下架
      description: '仅管理员；已发布 → 已下架；必须填写原因。


        覆盖需求：FR-REVIEW-004、BR-008'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: unpublishArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpublishRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/articles/{id}/audit-logs:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    get:
      tags:
      - AUDIT
      summary: 查看文章留痕
      description: '按时间正序；不存在修改或删除留痕的接口。


        覆盖需求：FR-AUDIT-002、X-AUDIT-02、X-AUDIT-03'
      operationId: listAuditLogs
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/categories:
    get:
      tags:
      - TAX
      summary: 分类列表
      description: '已登录可用；不分页。


        覆盖需求：FR-TAX-001、FR-TAX-003'
      operationId: listCategories
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - TAX
      summary: 创建分类
      description: '仅管理员；编辑调用 404。


        覆盖需求：FR-TAX-001、BR-TAX-005'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNameRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Category'
        '400':

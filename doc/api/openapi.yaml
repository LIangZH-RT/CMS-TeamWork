  /api/articles/{id}/media:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - MEDIA
      summary: 上传媒体
      description: '仅归属编辑，状态为草稿/驳回/已下架。按文件签名判定真实格式；图片 jpg/jpeg/png/gif/webp ≤5MB，音频 mp3/m4a/wav/ogg ≤20MB。上传后未关联，需通过编辑文章关联。


        覆盖需求：FR-MEDIA-001、BR-MEDIA-002、BR-MEDIA-005、BR-MEDIA-008'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - usage
              properties:
                file:
                  type: string
                  format: binary
                usage:
                  $ref: '#/components/schemas/MediaUsage'
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/media/{media_id}:
    get:
      tags:
      - MEDIA
      summary: 媒体文件出口
      description: '唯一媒体出口，匿名可达（可携带会话）。已发布文章的当前引用可匿名读；其余仅归属编辑/管理员可读；失去引用的文件任何人不可读。任何拒绝一律 404，不返回 401/403/409。Cache-Control: no-store。


        覆盖需求：FR-MEDIA-002、BR-MEDIA-003'
      security: []
      operationId: getMediaFile
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 文件字节流（Content-Type 为服务端判定的真实类型）
          content:
            image/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
        '206':
          description: 音频 Range 请求的部分内容【补充】
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/articles:
    get:
      tags:
      - PUBLIC
      summary: 已发布文章列表
      description: '仅返回已发布文章的白名单字段；未知参数（如 status）忽略。按 published_at 降序。可按关键字 q 匹配标题或摘要（范围延伸）。with_facets=true 时附带全部已发布文章引用的分类与标签（不受筛选影响）。


        覆盖需求：FR-PUBLIC-001、BR-ISO-004、BR-SEARCH-005、BR-TAX-003'
      security: []
      operationId: listPublicArticles
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: 【补充·范围延伸】关键字：去首尾空白后匹配标题或摘要（LIKE 子串，\ % _ 按字面转义）；不匹配正文；空串视为未传
      - name: with_facets
        in: query
        schema:
          type: boolean
          default: false
        description: 【补充】为 true 时返回 data.facets
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PublicArticlePage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/public/articles/{id}:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    get:
      tags:
      - PUBLIC
      summary: 已发布文章详情
      description: '不存在或非已发布统一 404。


        覆盖需求：FR-PUBLIC-002、BR-ISO-004、BR-MEDIA-003'
      security: []
      operationId: getPublicArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PublicArticleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 服务端会话；空闲 30 分钟、绝对 12 小时失效
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF 令牌，只能通过 GET /api/auth/csrf 的响应体获取（会话绑定）
  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 文章 ID
    TaxId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CategoryFilter:
      name: category_id
      in: query
      schema:
        type: integer
        format: int64
    TagIdsFilter:
      name: tag_ids
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
      description: 多值，交集语义
    TitleFilter:
      name: title
      in: query
      schema:
        type: string
      description: 标题模糊匹配
    AuthorFilter:
      name: author_id
      in: query
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: 请求参数或请求体不合法（code 400xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40000
            message: 参数校验失败
            data:
              field_errors:
              - field: title
                reason: 不能为空或全空白
    Unauthenticated:
      description: 未登录或会话失效（40100）；登录失败统一 40101
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40100
            message: 未登录或会话已失效
            data: null
    CsrfInvalid:
      description: CSRF 令牌缺失或不匹配
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40300
            message: CSRF 校验失败
            data: null
    NotFound:
      description: 资源不存在 / 无权限 / 非本人资源，响应体逐字节一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40400
            message: 资源不存在
            data: null
    Conflict:
      description: 状态或业务前提冲突（code 409xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40900
            message: 当前状态不允许该操作
            data: null
  schemas:
    Envelope:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          description: 0 成功；非 0 见错误码表
          example: 0
        message:
          type: string
          example: OK
        data:
          description: 业务数据，可为对象、数组或 null
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          enum:
          - 40000
          - 40001
          - 40002
          - 40003
          - 40004
          - 40005
          - 40006
          - 40007
          - 40008
          - 40009
          - 40010
          - 40011
          - 40012
          - 40013
          - 40014
          - 40100
          - 40101
          - 40300
          - 40400
          - 40900
          - 40901
          - 40902
          - 40903
          - 40904
          - 40905
          - 40906
          - 50000
        message:
          type: string
        data:
          type: object
          nullable: true
          properties:
            field_errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
    PageMeta:
      type: object
      required:
      - page
      - page_size
      - total
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
          description: 过滤后结果集总数
    ArticleStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_REVIEW
      - REJECTED
      - SCHEDULED
      - PUBLISHED
      - UNPUBLISHED
      description: 草稿/待审核/驳回/待发布/已发布/已下架
    Role:
      type: string
      enum:
      - EDITOR
      - ADMIN
    AuditAction:
      type: string
      enum:
      - SUBMIT
      - APPROVE
      - REJECT
      - UNPUBLISH
      - WITHDRAW
      - RESCHEDULE
      - AUTO_PUBLISH
    ActorType:
      type: string
      enum:
      - USER
      - SYSTEM
    RejectCategory:
      type: string
      enum:
      - ILLEGAL
      - AUTHENTICITY_SOURCE
      - COPYRIGHT_PRIVACY
      - MINOR_VULGAR_VIOLENCE
      - DISCRIMINATION_HARASSMENT
      - SPAM_MARKETING
      - QUALITY_POSITIONING
      - OTHER
    MediaUsage:
      type: string
      enum:
      - COVER
      - INLINE_IMAGE
      - AUDIO
    LatestEventType:
      type: string
      enum:
      - REJECT
      - UNPUBLISH
    ArticleAction:
      type: string
      enum:
      - EDIT
      - DELETE
      - SUBMIT
      - WITHDRAW
      - RESCHEDULE
      - UPLOAD_MEDIA
      - APPROVE
      - REJECT
      - UNPUBLISH
    User:
      type: object
      required:
      - id
      - username
      - role
      - created_at
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          example: editor_01
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
    UserBrief:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    Actor:
      type: object
      required:
      - type
      - id
      - username
      properties:
        type:
          $ref: '#/components/schemas/ActorType'
        id:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
          nullable: true
    Category:
      type: object
      required:
      - id
      - name
      - in_use
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        in_use:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tag:
      type: object
      required:
      - id
      - name
      - in_use
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        in_use:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaxonomyBrief:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    TaxonomyNameRequest:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    MediaRef:
      type: object
      required:
      - media_id
      - url
      - mime_type
      - size
      properties:
        media_id:
          type: integer
          format: int64
        url:
          type: string
          example: /api/media/5000
        mime_type:
          type: string
        size:
          type: integer
          format: int64
    Media:
      type: object
      required:
      - media_id
      - article_id
      - usage
      - url
      - mime_type
      - size
      - linked
      - created_at
      properties:
        media_id:
          type: integer
          format: int64
        article_id:
          type: integer
          format: int64
        usage:
          $ref: '#/components/schemas/MediaUsage'
        url:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        linked:
          type: boolean
        created_at:
          type: string
          format: date-time
    LatestRejection:
      type: object
      nullable: true
      required:
      - reject_category
      - comment
      - operator
      - operated_at
      properties:
        reject_category:
          $ref: '#/components/schemas/RejectCategory'
        comment:
          type: string
        operator:
          $ref: '#/components/schemas/Actor'
        operated_at:
          type: string
          format: date-time
    LatestUnpublish:
      type: object
      nullable: true
      required:
      - reason
      - operator
      - operated_at
      properties:
        reason:
          type: string
        operator:
          $ref: '#/components/schemas/Actor'
        operated_at:
          type: string
          format: date-time
    LatestEvent:
      type: object
      nullable: true
      required:
      - type
      - operated_at
      - operator
      - reject_category
      - reason
      properties:
        type:
          $ref: '#/components/schemas/LatestEventType'
        operated_at:
          type: string
          format: date-time
        operator:
          $ref: '#/components/schemas/Actor'
        reject_category:
          type: string
          allOf:
          - $ref: '#/components/schemas/RejectCategory'
          nullable: true
        reason:
          type: string
    Article:
      type: object
      required:
      - id
      - title
      - content
      - excerpt
      - cover
      - audio
      - category
      - tags
      - scheduled_publish_time
      - status
      - author
      - published_at
      - created_at
      - updated_at
      - submitted_at
      - latest_rejection
      - latest_unpublish
      - current_submission_id
      - allowed_actions
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
          description: Markdown 原文
        excerpt:
          type: string
          description: 未填写为空字符串
        cover:
          type: object
          allOf:
          - $ref: '#/components/schemas/MediaRef'
          nullable: true
        audio:
          type: object
          allOf:
          - $ref: '#/components/schemas/MediaRef'
          nullable: true
        category:
          $ref: '#/components/schemas/TaxonomyBrief'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/ArticleStatus'
        author:
          $ref: '#/components/schemas/UserBrief'
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
          nullable: true
        latest_rejection:
          $ref: '#/components/schemas/LatestRejection'
        latest_unpublish:
          $ref: '#/components/schemas/LatestUnpublish'
        current_submission_id:
          type: integer
          format: int64
          nullable: true
          description: 仅管理员查看待审核文章时有值
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ArticleAction'
          description: 【补充】当前请求者在当前状态下可执行的动作，仅作界面提示（口径见 api-spec §4.1）

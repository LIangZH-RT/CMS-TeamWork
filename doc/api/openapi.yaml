                  properties:
                    data:
                      $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/categories/sort:
    put:
      tags:
      - TAX
      summary: '#39 同级批量排序（单事务）'
      description: 'items 必须都是 parent_id 下未删除的分类；任一条不合法则整批不生效。



        覆盖需求：FR-TAX-006、BR-TAX-007'
      operationId: sortCategories
      x-permission: category:update
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorySortRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/reviews/batch-approve:
    post:
      tags:
      - REVIEW
      summary: '#40 批量审核通过'
      description: '逐条独立事务，逐条执行 #16 的完整规则（含轮次校验与留痕）；不提供批量驳回。条目 1~50，超出 400 40017。



        覆盖需求：FR-REVIEW-005、BR-BATCH-001~005'
      operationId: batchApprove
      x-permission: review:approve
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchApproveRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/reviews/batch-unpublish:
    post:
      tags:
      - REVIEW
      summary: '#41 批量下架'
      description: '逐条独立事务，共用一个下架原因。



        覆盖需求：FR-REVIEW-006、BR-BATCH-001~004'
      operationId: batchUnpublish
      x-permission: review:unpublish
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUnpublishRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/articles/batch-delete:
    post:
      tags:
      - ARTICLE
      summary: '#42 批量删除草稿'
      description: '逐条独立事务，逐条执行 #10（逻辑删除）；他人草稿与不存在都返回 40400。管理员调用 404。



        覆盖需求：FR-ARTICLE-007、BR-BATCH-001~004、BR-DEL-001~008'
      operationId: batchDeleteArticles
      x-permission: article:delete
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/media/{media_id}/download:
    get:
      tags:
      - MEDIA
      summary: '#43 媒体下载（附件）'
      description: '判权与 #29 完全相同，任何拒绝一律 404。Content-Disposition: attachment，文件名为上传时的原始文件名（RFC 5987 filename*=UTF-8）；流式输出；Cache-Control: no-store。实验二上传下载的延续。



        覆盖需求：FR-MEDIA-005、BR-MEDIA-003'
      security: []
      operationId: downloadMediaFile
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 文件字节流（附件）
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="5001.png"; filename*=UTF-8''%E6%9E%B6%E6%9E%84%E5%9B%BE.png
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: anonymous
  /api/admin/operation-logs:
    get:
      tags:
      - OPLOG
      summary: '#44 系统操作日志'
      description: '只读；与 #19 文章留痕是两张表。不提供修改或删除日志的接口。



        覆盖需求：FR-OPLOG-002、BR-OPLOG-005'
      operationId: listOperationLogs
      x-permission: oplog:read
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: operator_id
        in: query
        schema:
          type: integer
          format: int64
      - name: module
        in: query
        schema:
          $ref: '#/components/schemas/OplogModule'
      - name: success
        in: query
        schema:
          type: boolean
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^(created_at),(asc|desc)$
          default:
          - created_at,desc
        description: 多字段排序，可重复，按出现顺序生效；末尾固定追加 id（v2.6，BR-SEARCH-007）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        required:
                        - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/OperationLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 服务端会话；空闲 30 分钟、绝对 12 小时失效
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF 令牌，只能通过 GET /api/auth/csrf 的响应体获取（会话绑定）
  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 文章 ID
    TaxId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CategoryFilter:
      name: category_id
      in: query
      schema:
        type: integer
        format: int64
    TagIdsFilter:
      name: tag_ids
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
      description: 多值，交集语义
    TitleFilter:
      name: title
      in: query
      schema:
        type: string
      description: v0.1 旧参数，v2.6 起为 keyword 的别名（匹配标题或摘要）；前端改用 keyword 后删除
      deprecated: true
    AuthorFilter:
      name: author_id
      in: query
      schema:
        type: integer
        format: int64
    KeywordFilter:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 100
      description: 关键字，匹配标题或摘要（v2.6，BR-SEARCH-001）
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 账号 ID
  responses:
    BadRequest:
      description: 请求参数或请求体不合法（code 400xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40000
            message: 参数校验失败
            data:
              field_errors:
              - field: title
                reason: 不能为空或全空白
    Unauthenticated:
      description: 未登录或会话失效（40100）；登录失败统一 40101
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40100
            message: 未登录或会话已失效
            data: null
    CsrfInvalid:
      description: CSRF 令牌缺失或不匹配
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40300
            message: CSRF 校验失败
            data: null
    NotFound:
      description: 资源不存在 / 无权限 / 非本人资源，响应体逐字节一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40400
            message: 资源不存在
            data: null
    Conflict:
      description: 状态或业务前提冲突（code 409xx）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 40900
            message: 当前状态不允许该操作
            data: null
  schemas:
    Envelope:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          description: 0 成功；非 0 见错误码表
          example: 0
        message:
          type: string
          example: OK
        data:
          description: 业务数据，可为对象、数组或 null
    ErrorEnvelope:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          enum:
          - 40000
          - 40001
          - 40002
          - 40003
          - 40004
          - 40005
          - 40006
          - 40007
          - 40008
          - 40009
          - 40010
          - 40011
          - 40012
          - 40013
          - 40014
          - 40015
          - 40016
          - 40017
          - 40018
          - 40100
          - 40101
          - 40300
          - 40400
          - 40900
          - 40901
          - 40902
          - 40903
          - 40904
          - 40905
          - 40906
          - 40907
          - 40908
          - 40909
          - 40910
          - 50000
        message:
          type: string
        data:
          type: object
          nullable: true
          properties:
            field_errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
    PageMeta:
      type: object
      required:
      - page
      - page_size
      - total
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
          description: 过滤后结果集总数
    ArticleStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_REVIEW
      - REJECTED
      - SCHEDULED
      - PUBLISHED
      - UNPUBLISHED
      description: 草稿/待审核/驳回/待发布/已发布/已下架
    Role:
      type: string
      enum:
      - EDITOR
      - ADMIN
    AuditAction:
      type: string
      enum:
      - SUBMIT
      - APPROVE
      - REJECT
      - UNPUBLISH
      - WITHDRAW
      - RESCHEDULE
      - AUTO_PUBLISH
    ActorType:
      type: string
      enum:
      - USER
      - SYSTEM
    RejectCategory:
      type: string
      enum:
      - ILLEGAL
      - AUTHENTICITY_SOURCE
      - COPYRIGHT_PRIVACY
      - MINOR_VULGAR_VIOLENCE
      - DISCRIMINATION_HARASSMENT
      - SPAM_MARKETING
      - QUALITY_POSITIONING
      - OTHER
    MediaUsage:
      type: string
      enum:
      - COVER
      - INLINE_IMAGE
      - AUDIO
    LatestEventType:
      type: string
      enum:
      - REJECT
      - UNPUBLISH
    ArticleAction:
      type: string
      enum:
      - EDIT
      - DELETE
      - SUBMIT
      - WITHDRAW
      - RESCHEDULE
      - UPLOAD_MEDIA
      - APPROVE
      - REJECT
      - UNPUBLISH
    User:
      type: object
      required:
      - id
      - username
      - role
      - role_name
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          example: editor_01
        role:
          $ref: '#/components/schemas/Role'
        role_name:
          type: string
          example: 内容编辑
        status:
          $ref: '#/components/schemas/AccountStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserBrief:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    Actor:
      type: object
      required:
      - type
      - id
      - username
      properties:
        type:
          $ref: '#/components/schemas/ActorType'
        id:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
          nullable: true
    Category:
      type: object
      required:
      - id
      - name
      - parent_id
      - sort_order
      - status
      - in_use
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: 一级分类为 null（v2.6）
        sort_order:
          type: integer
          description: 同级升序（v2.6）
        status:
          $ref: '#/components/schemas/CategoryStatus'
        in_use:
          type: boolean
          description: 是否被未删除文章引用
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: '仅 #20 树形响应中出现；二级分类为空数组（v2.6）'
    Tag:
      type: object
      required:
      - id
      - name
      - in_use
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        in_use:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaxonomyBrief:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    TaxonomyNameRequest:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    MediaRef:
      type: object
      required:
      - media_id
      - url
      - mime_type
      - size
      properties:
        media_id:
          type: integer
          format: int64
        url:
          type: string
          example: /api/media/5000
        mime_type:
          type: string
        size:
          type: integer
          format: int64
    Media:
      type: object
      required:
      - media_id
      - article_id
      - usage
      - url
      - download_url
      - mime_type
      - size
      - original_name
      - linked
      - created_at
      properties:
        media_id:
          type: integer
          format: int64
        article_id:
          type: integer
          format: int64
        usage:
          $ref: '#/components/schemas/MediaUsage'
        url:
          type: string
        download_url:
          type: string
          example: /api/media/5001/download
          description: v2.6
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        original_name:
          type: string
          maxLength: 255
          description: '上传时的原始文件名，下载 #43 用（v2.6）'
        linked:
          type: boolean
        created_at:
          type: string
          format: date-time
    LatestRejection:
      type: object
      nullable: true
      required:
      - reject_category
      - comment
      - operator
      - operated_at
      properties:
        reject_category:
          $ref: '#/components/schemas/RejectCategory'
        comment:
          type: string
        operator:
          $ref: '#/components/schemas/Actor'
        operated_at:
          type: string
          format: date-time
    LatestUnpublish:
      type: object
      nullable: true
      required:
      - reason
      - operator
      - operated_at
      properties:
        reason:
          type: string
        operator:
          $ref: '#/components/schemas/Actor'
        operated_at:
          type: string
          format: date-time
    LatestEvent:
      type: object
      nullable: true
      required:
      - type
      - operated_at
      - operator
      - reject_category
      - reason
      properties:
        type:
          $ref: '#/components/schemas/LatestEventType'
        operated_at:
          type: string
          format: date-time
        operator:
          $ref: '#/components/schemas/Actor'
        reject_category:
          type: string
          allOf:
          - $ref: '#/components/schemas/RejectCategory'
          nullable: true
        reason:
          type: string
    Article:
      type: object
      required:
      - id
      - title
      - content
      - excerpt
      - cover
      - audio
      - category
      - tags
      - scheduled_publish_time
      - status
      - author
      - published_at
      - created_at
      - updated_at
      - version
      - submitted_at
      - latest_rejection
      - latest_unpublish
      - current_submission_id
      - allowed_actions
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
          description: Markdown 原文
        excerpt:
          type: string
          description: 未填写为空字符串
        cover:
          type: object
          allOf:
          - $ref: '#/components/schemas/MediaRef'
          nullable: true
        audio:
          type: object
          allOf:
          - $ref: '#/components/schemas/MediaRef'
          nullable: true
        category:
          $ref: '#/components/schemas/TaxonomyBrief'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/ArticleStatus'
        author:
          $ref: '#/components/schemas/UserBrief'
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          minimum: 0
          description: 内容版本号（乐观锁）；创建为 0，每次编辑保存成功加 1，流程动作不变。编辑时原样带回为 expected_version
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次提交审核时间；不存表，取本轮「提交审核」留痕的时间
        latest_rejection:
          $ref: '#/components/schemas/LatestRejection'
        latest_unpublish:
          $ref: '#/components/schemas/LatestUnpublish'
        current_submission_id:
          type: integer
          format: int64
          nullable: true
          description: 仅管理员查看待审核文章时有值
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ArticleAction'
          description: 【补充】当前请求者在当前状态下可执行的动作，仅作界面提示（口径见 api-spec §4.1）
    ArticleListItem:
      type: object
      required:
      - id
      - title
      - status
      - category
      - tags
      - author
      - updated_at
      - submitted_at
      - scheduled_publish_time
      - published_at
      - latest_event
      - allowed_actions
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        status:
          $ref: '#/components/schemas/ArticleStatus'
        category:
          $ref: '#/components/schemas/TaxonomyBrief'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
        author:
          $ref: '#/components/schemas/UserBrief'
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
          nullable: true
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        latest_event:
          $ref: '#/components/schemas/LatestEvent'
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ArticleAction'
          description: 【补充】当前请求者在当前状态下可执行的动作，仅作界面提示（口径见 api-spec §4.1）
    ArticleCreateRequest:
      type: object
      required:
      - title
      - content
      - category_id
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          description: Markdown 原文；≤ 1 MiB（UTF-8 字节，服务端校验）
        excerpt:
          type: string
          maxLength: 500
          default: ''
        category_id:
          type: integer
          format: int64
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
          default: []
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
    ArticleUpdateRequest:
      type: object
      required:
      - title
      - content
      - category_id
      - expected_version
      additionalProperties: false
      description: 全量替换；可选字段省略即置空
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          description: Markdown 原文；≤ 1 MiB（UTF-8 字节，服务端校验）
        excerpt:
          type: string
          maxLength: 500
          default: ''
        expected_version:
          type: integer
          format: int32
          minimum: 0
          description: 编辑页加载时拿到的 Article.version；不一致返回 409 VERSION_CONFLICT
        category_id:
          type: integer
          format: int64
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
          default: []
        cover_media_id:
          type: integer
          format: int64
          nullable: true
        audio_media_id:
          type: integer
          format: int64
          nullable: true
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
    StatusResult:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ArticleStatus'
        submitted_at:
          type: string
          format: date-time
          nullable: true
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
    RescheduleRequest:
      type: object
      required:
      - scheduled_publish_time
      additionalProperties: false
      properties:
        scheduled_publish_time:
          type: string
          format: date-time
        expected_scheduled_publish_time:
          type: string
          format: date-time
          description: 【补充】旧页面识别
    ApproveRequest:
      type: object
      required:
      - submission_id
      additionalProperties: false
      properties:
        submission_id:
          type: integer
          format: int64
    RejectRequest:
      type: object
      required:
      - submission_id
      - reject_category
      - comment
      additionalProperties: false
      properties:
        submission_id:
          type: integer
          format: int64
        reject_category:
          $ref: '#/components/schemas/RejectCategory'
        comment:
          type: string
          minLength: 1
          maxLength: 500
    UnpublishRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ReviewQueueItem:
      type: object
      required:
      - id
      - title
      - author
      - category
      - tags
      - submitted_at
      - scheduled_publish_time
      - current_submission_id
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          $ref: '#/components/schemas/UserBrief'
        category:
          $ref: '#/components/schemas/TaxonomyBrief'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
        submitted_at:
          type: string
          format: date-time
        scheduled_publish_time:
          type: string
          format: date-time
          nullable: true
        current_submission_id:
          type: integer
          format: int64
    ReviewStandard:
      type: object
      required:
      - review_standard_version
      - reject_categories
      properties:
        review_standard_version:
          type: string
          example: CMS-CONTENT-REVIEW-1.0
        reject_categories:
          type: array
          items:
            type: object
            properties:
              value:
                $ref: '#/components/schemas/RejectCategory'
              label:
                type: string
    ScheduleChange:
      type: object
      nullable: true
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    AuditLog:
      type: object
      required:
      - id
      - article_id
      - action
      - operator
      - operated_at
      - reason
      - reject_category
      - review_standard_version
      - published_at
      - schedule_change
      - related_approval_id
      - related_submission_id
      properties:
        id:
          type: integer
          format: int64
        article_id:
          type: integer
          format: int64
        action:
          $ref: '#/components/schemas/AuditAction'
        operator:
          $ref: '#/components/schemas/Actor'
        operated_at:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        reject_category:
          type: string
          allOf:
          - $ref: '#/components/schemas/RejectCategory'
          nullable: true
        review_standard_version:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        schedule_change:
          $ref: '#/components/schemas/ScheduleChange'
        related_approval_id:
          type: integer
          format: int64
          nullable: true
        related_submission_id:
          type: integer
          format: int64
          nullable: true
    StatusCounts:
      type: object
      required:
      - by_status
      - total
      properties:
        by_status:
          type: object
          required:
          - DRAFT
          - PENDING_REVIEW
          - REJECTED
          - SCHEDULED
          - PUBLISHED
          - UNPUBLISHED
          properties:
            DRAFT:
              type: integer
              format: int64
              minimum: 0
            PENDING_REVIEW:
              type: integer
              format: int64
              minimum: 0
            REJECTED:
              type: integer
              format: int64
              minimum: 0
            SCHEDULED:
              type: integer
              format: int64
              minimum: 0
            PUBLISHED:
              type: integer
              format: int64
              minimum: 0
            UNPUBLISHED:
              type: integer
              format: int64
              minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    CredentialsRequest:
      type: object
      required:
      - username
      - password
      additionalProperties: false
      properties:
        username:
          type: string
          description: 去首尾空白后 3～32 位 [A-Za-z0-9_]，不区分大小写
        password:
          type: string
          description: 8～64 个 Unicode 码点，不允许全空白
          format: password
    LoginResult:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    CsrfToken:
      type: object
      required:
      - header_name
      - token
      properties:
        header_name:
          type: string
          example: X-XSRF-TOKEN
        token:
          type: string
    PublicArticleListItem:
      type: object
      required:
      - id
      - title
      - excerpt
      - cover_url
      - category
      - tags
      - published_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        excerpt:
          type: string
        cover_url:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/TaxonomyBrief'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
        published_at:
          type: string
          format: date-time
    PublicFacets:
      type: object
      nullable: true
      required:
      - categories
      - tags
      description: 【补充】全部已发布文章引用的分类与标签，按 id 升序；与本次筛选、分页无关
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyBrief'
    PublicArticlePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        - facets
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/PublicArticleListItem'
          facets:
            allOf:
            - $ref: '#/components/schemas/PublicFacets'
            nullable: true
            description: with_facets=true 时返回，否则为 null
            type: object
    PublicArticleDetail:
      allOf:
      - $ref: '#/components/schemas/PublicArticleListItem'
      - type: object
        required:
        - content
        - audio_url
        properties:
          content:
            type: string
          audio_url:
            type: string
            nullable: true
    AccountStatus:
      type: string
      enum:
      - ENABLED
      - DISABLED
      description: 账号状态（v2.6，BR-USER-001）
    CategoryStatus:
      type: string
      enum:
      - ENABLED
      - DISABLED
      description: 分类状态（v2.6，BR-TAX-008）
    PermissionCode:
      type: string
      enum:
      - article:create
      - article:update
      - article:delete
      - article:submit
      - article:withdraw
      - article:reschedule
      - article:read
      - article:read:all
      - review:queue
      - review:approve
      - review:reject
      - review:unpublish
      - audit:read
      - category:read
      - category:create
      - category:update
      - category:delete
      - tag:read
      - tag:create
      - tag:update
      - tag:delete
      - media:upload
      - user:read
      - user:status
      - user:assign-role
      - role:read
      - oplog:read
      description: 权限点（v2.6，SRS §4.7，27 个）
    OplogModule:
      type: string
      enum:
      - AUTH
      - ARTICLE
      - REVIEW
      - TAX
      - MEDIA
      - USER
      description: 操作日志模块（v2.6）
    CurrentUser:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - permissions
        properties:
          permissions:
            type: array
            items:
              $ref: '#/components/schemas/PermissionCode'
            description: 当前角色持有的权限点，按代码升序；前端据此显示菜单（FR-AUTH-005）
    RoleDetail:
      type: object
      required:
      - code
      - name
      - permissions
      properties:
        code:
          $ref: '#/components/schemas/Role'
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
    Permission:
      type: object
      required:
      - code
      - name
      - module
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        name:
          type: string
        module:
          type: string
          enum:
          - ARTICLE
          - REVIEW
          - AUDIT
          - TAX
          - MEDIA
          - USER
          - OPLOG
    UserStatusRequest:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
    UserRoleRequest:
      type: object
      required:
      - role_code
      additionalProperties: false
      properties:
        role_code:
          $ref: '#/components/schemas/Role'
    CategoryCreateRequest:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: 只能是未删除的一级分类
        sort_order:
          type: integer
          default: 0
    CategoryUpdateRequest:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        parent_id:
          type: integer
          format: int64
          nullable: true
    CategoryStatusRequest:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/CategoryStatus'
    CategorySortRequest:
      type: object
      required:
      - parent_id
      - items
      additionalProperties: false
      properties:
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: null 表示一级分类
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required:
            - id
            - sort_order
            properties:
              id:
                type: integer
                format: int64
              sort_order:
                type: integer
    OperationLog:
      type: object
      required:
      - id
      - operator
      - module
      - operation
      - target_type
      - target_id
      - http_method
      - request_uri
      - client_ip
      - success
      - error_code
      - duration_ms
      - created_at
      properties:
        id:
          type: integer
          format: int64
        operator:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          nullable: true
          type: object
        module:
          $ref: '#/components/schemas/OplogModule'
        operation:
          type: string
          example: ARTICLE_DELETE
        target_type:
          type: string
          nullable: true
        target_id:
          type: integer
          format: int64
          nullable: true
        http_method:
          type: string
          enum:
          - POST
          - PUT
          - PATCH
          - DELETE
        request_uri:
          type: string
        client_ip:
          type: string
        success:
          type: boolean
        error_code:
          type: integer
          nullable: true
        duration_ms:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
      description: 不含请求体、密码、登录失败时尝试的登录名（BR-OPLOG-003）
    BatchItemResult:
      type: object
      required:
      - id
      - success
      - code
      - message
      properties:
        id:
          type: integer
          format: int64
        success:
          type: boolean
        code:
          type: integer
          description: 0 成功；失败码与单条接口一致，不存在与无权都是 40400
        message:
          type: string
    BatchResult:
      type: object
      required:
      - total
      - succeeded
      - failed
      - results
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemResult'
      example:
        total: 2
        succeeded: 1
        failed: 1
        results:
        - id: 101
          success: true
          code: 0
          message: OK
        - id: 999
          success: false
          code: 40400
          message: 资源不存在
    BatchApproveRequest:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required:
            - article_id
            - submission_id
            properties:
              article_id:
                type: integer
                format: int64
              submission_id:
                type: integer
                format: int64
                description: 该篇管理员实际查看的提交轮次（BR-BATCH-005）
    BatchUnpublishRequest:
      type: object
      required:
      - article_ids
      - reason
      additionalProperties: false
      properties:
        article_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            format: int64
        reason:
          type: string
          minLength: 1
          maxLength: 500
    BatchDeleteRequest:
      type: object
      required:
      - article_ids
      - confirm
      additionalProperties: false
      properties:
        article_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
            format: int64
        confirm:
          type: boolean
          enum:
          - true

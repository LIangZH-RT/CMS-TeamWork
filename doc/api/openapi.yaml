openapi: 3.0.3
info:
  title: CMS-TeamWork 前后端统一接口（草案）
  version: 0.2.0
  license:
    name: Proprietary (team internal draft)
  description: '依据 CMS-SRS.md v2.6 与 doc/context/architecture.md。与 doc/api/api-spec.md 一致；详细规则、错误码与追溯以 doc/api/api-spec.md 为准。


    认证：服务端会话 Cookie（JSESSIONID，HttpOnly）+ CSRF 请求头 X-XSRF-TOKEN（登录除外的所有写请求）。不使用 JWT。


    统一响应体 {code, message, data}；HTTP 状态码按 SRS（400/401/403/404/409）。权限闸（@RequiresPermission，AOP）、归属闸失败统一 404；权限不足不返回 403。每个操作的 x-permission 为所需权限点（anonymous = 匿名，authenticated = 仅需登录），与 api-spec §3.4 一致。



    v0.2（SRS v2.6）：新增 #33～#44 共 12 个接口，11 处已有接口改动，新增 7 个错误码，见 api-spec §17。'
servers:
- url: /
  description: 同源部署，Nginx 反向代理 /api/**
security:
- sessionCookie: []
tags:
- name: AUTH
  description: 认证与账号
- name: USER
  description: 用户、角色与权限点（v2.6）
- name: ARTICLE
  description: 文章管理
- name: SUBMIT
  description: 提交、撤回与改期
- name: REVIEW
  description: 审核与下架
- name: AUDIT
  description: 操作留痕
- name: OPLOG
  description: 系统操作日志（v2.6）
- name: TAX
  description: 分类与标签
- name: MEDIA
  description: 媒体资源
- name: PUBLIC
  description: 博客前台公开接口
paths:
  /api/auth/csrf:
    get:
      tags:
      - AUTH
      summary: 获取 CSRF 令牌【补充】
      description: '在响应体返回会话绑定的 CSRF 令牌（由 CsrfInterceptor 校验）；不下发可读的 CSRF Cookie。登录、登出后需重新获取。


        覆盖需求：§4.1.2、FR-AUTH-003'
      security: []
      operationId: getCsrfToken
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CsrfToken'
      x-permission: anonymous
  /api/auth/register:
    post:
      tags:
      - AUTH
      summary: 注册内容编辑账号
      description: '只能创建 EDITOR；注册不建立会话。需要 CSRF（匿名令牌）。


        覆盖需求：FR-USER-001、§4.1.1



        v2.6：写入 role_id = EDITOR、status = ENABLED。'
      security: []
      operationId: register
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: anonymous
  /api/auth/login:
    post:
      tags:
      - AUTH
      summary: 登录
      description: '成功后更换会话标识并下发 JSESSIONID（HttpOnly; SameSite=Lax; Path=/），登录前的 CSRF 令牌随之失效。不需要 CSRF。连续 5 次失败锁定 15 分钟；失败与锁定响应一致（40101）。


        覆盖需求：FR-AUTH-001、FR-AUTH-003、§4.1.2



        v2.6：已停用账号按 40101 统一失败（BR-USER-001）；成功、失败都记操作日志（失败不记登录名）。'
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-permission: anonymous
  /api/auth/logout:
    post:
      tags:
      - AUTH
      summary: 登出
      description: '销毁当前会话。


        覆盖需求：FR-AUTH-002'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: logout
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: 恒为 null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
      x-permission: authenticated
  /api/auth/me:
    get:
      tags:
      - AUTH
      summary: 当前用户
      description: '返回当前用户与角色，用于前端角色分流。


        覆盖需求：FR-AUTH-005



        v2.6：增加 role_name、status、updated_at、permissions（FR-AUTH-005、BR-RBAC-005）。'
      operationId: getMe
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-permission: authenticated
  /api/articles:
    get:
      tags:
      - ARTICLE
      summary: 文章列表（编辑：我的文章；管理员：全部）
      description: '编辑结果集强制附加 author_id=当前用户；total 基于过滤后结果。


        覆盖需求：FR-ARTICLE-003、FR-ARTICLE-006、BR-SEARCH-001~005、X-ISO-01~04



        v2.6：category_id 为一级分类时含子分类（BR-SEARCH-008）；keyword 匹配标题或摘要；时间范围左闭右开；sort 改为 字段,方向 多值格式，旧取值 updated_at_desc 等作废；非白名单 400 40018。'
      operationId: listArticles
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ArticleStatus'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - $ref: '#/components/parameters/KeywordFilter'
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/AuthorFilter'
      - name: created_from
        in: query
        schema:
          type: string
          format: date-time
      - name: created_to
        in: query
        schema:
          type: string
          format: date-time
      - name: updated_from
        in: query
        schema:
          type: string
          format: date-time
      - name: updated_to
        in: query
        schema:
          type: string
          format: date-time
      - name: published_from
        in: query
        schema:
          type: string
          format: date-time
      - name: published_to
        in: query
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^(updated_at|created_at|published_at|title|id),(asc|desc)$
          default:
          - updated_at,desc
        description: 多字段排序，可重复，按出现顺序生效；末尾固定追加 id（v2.6，BR-SEARCH-007）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        required:
                        - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ArticleListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-permission: article:read
    post:
      tags:
      - ARTICLE
      summary: 创建文章草稿
      description: '仅编辑；管理员调用 404。系统字段或未知字段 → 400 FIELD_NOT_WRITABLE。正文规则见 doc/api/api-spec.md §6.0。


        覆盖需求：FR-ARTICLE-001、FR-TAX-003、FR-MEDIA-004



        v2.6：选用停用分类 400 40015。'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: article:create
  /api/articles/counts:
    get:
      tags:
      - ARTICLE
      summary: 按状态计数【补充】
      description: '与文章列表同一套归属过滤：编辑只统计本人，管理员统计全部；6 种状态都返回，无文章为 0。不返回 404。


        覆盖需求：FR-ARTICLE-003、FR-ARTICLE-006、BR-SEARCH-002、BR-SEARCH-003、X-ISO-03、X-ISO-04'
      operationId: countArticlesByStatus
      parameters:
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/AuthorFilter'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      x-permission: article:read
  /api/articles/{id}:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    get:
      tags:
      - ARTICLE
      summary: 文章详情
      description: '编辑仅本人文章；管理员全部。管理员查看待审核文章时返回 current_submission_id。


        覆盖需求：FR-ARTICLE-004、FR-REVIEW-001、BR-CONTENT-001'
      operationId: getArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Article'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: article:read
    put:
      tags:
      - ARTICLE
      summary: 编辑文章
      description: '仅归属编辑，状态为草稿/驳回/已下架；全量替换；同时完成分类、标签、媒体关联/移除/替换。


        必须带 expected_version（乐观锁）；与当前版本不一致返回 409 VERSION_CONFLICT（40907），状态冲突优先。


        覆盖需求：FR-ARTICLE-002、FR-TAX-003、FR-MEDIA-001、FR-MEDIA-004



        v2.6：选用停用分类 400 40015。'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: article:update
    delete:
      tags:
      - ARTICLE
      summary: 删除草稿
      description: '仅归属编辑；仅状态为草稿且无任何留痕；物理删除并清理媒体。


        覆盖需求：FR-ARTICLE-005、BR-DEL-001~005



        v2.6：改为逻辑删除（BR-DEL-002），其余规则不变；记操作日志。'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: deleteArticle
      parameters:
      - name: confirm
        in: query
        required: true
        schema:
          type: boolean
          enum:
          - true
        description: 二次确认，必须为 true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: 恒为 null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: article:delete
  /api/articles/{id}/submit:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - SUBMIT
      summary: 提交审核
      description: '草稿/驳回/已下架 → 待审核；生成提交审核留痕（其 ID 即提交轮次标识）。


        覆盖需求：FR-SUBMIT-001、BR-001'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: submitArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: article:submit
  /api/articles/{id}/withdraw:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - SUBMIT
      summary: 撤回待发布文章
      description: '待发布 → 草稿；清空预定时间，审核结论作废。


        覆盖需求：FR-SUBMIT-002、BR-PUB-009'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: withdrawArticle
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: article:withdraw
  /api/articles/{id}/reschedule:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - SUBMIT
      summary: 修改待发布文章的预定时间
      description: '新时间须严格晚于服务端当前时间；原预定时间已到 → 409。


        覆盖需求：FR-SUBMIT-003、BR-PUB-008'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: rescheduleArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: article:reschedule
  /api/reviews/queue:
    get:
      tags:
      - REVIEW
      summary: 审核队列
      description: '仅管理员；按 submitted_at 升序、id 升序，固定排序。


        覆盖需求：FR-REVIEW-001'
      operationId: listReviewQueue
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/CategoryFilter'
      - $ref: '#/components/parameters/TagIdsFilter'
      - $ref: '#/components/parameters/AuthorFilter'
      - $ref: '#/components/parameters/TitleFilter'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        required:
                        - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ReviewQueueItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: review:queue
  /api/reviews/standard:
    get:
      tags:
      - REVIEW
      summary: 当前审核标准与驳回类别【补充】
      description: '仅管理员。


        覆盖需求：§6.1.1、BR-CONTENT-005'
      operationId: getReviewStandard
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ReviewStandard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
      x-permission: review:queue
  /api/articles/{id}/approve:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - REVIEW
      summary: 审核通过（含立即发布）
      description: '仅管理员；待审核且轮次匹配。无/已到预定时间 → 已发布；未来预定时间 → 待发布。原子生效。不接受内容字段或发布参数。


        覆盖需求：FR-REVIEW-002、FR-PUBLISH-001、FR-PUBLISH-003'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: approveArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: review:approve
  /api/articles/{id}/reject:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - REVIEW
      summary: 驳回
      description: '仅管理员；必须带轮次、驳回类别与意见。


        覆盖需求：FR-REVIEW-003、BR-004、BR-AUDIT-003'
      security:
      - sessionCookie: []
        csrfHeader: []
      operationId: rejectArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-permission: review:reject
  /api/articles/{id}/unpublish:
    parameters:
    - $ref: '#/components/parameters/ArticleId'
    post:
      tags:
      - REVIEW
      summary: 下架
      description: '仅管理员；已发布 → 已下架；必须填写原因。


